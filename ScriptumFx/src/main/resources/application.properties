# Configuración de la aplicación ScriptumFX
# ==========================================

# URL de la API de Scriptum
# Para desarrollo local: http://localhost:8000
# Para producción: https://scriptum-api-production.up.railway.app
scriptum.api.url=https://scriptum-api-production.up.railway.app

# Timeout para peticiones HTTP (en segundos)
scriptum.api.timeout=30

# Puerto por defecto para desarrollo local
scriptum.api.port=8000
