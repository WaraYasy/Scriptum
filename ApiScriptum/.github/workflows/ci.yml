# Pipeline de Integración Continua (CI) para Scriptum API
# Este workflow se ejecuta automáticamente en GitHub Actions para validar
# el código cada vez que se hace push o pull request

name: CI - Scriptum API

# Eventos que disparan la ejecución del workflow
on:
  # Se ejecuta cuando se hace push a main o develop
  push:
    branches: [ main, develop ]
  # Se ejecuta cuando se abre/actualiza un pull request hacia main
  pull_request:
    branches: [ main ]

# Definición de los trabajos (jobs) a ejecutar
jobs:
  # Job 1: Análisis de código (linting)
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint

    - name: Run pylint on app
      run: |
        python -m pylint app --exit-zero --output-format=text
      continue-on-error: true

  # Job 2: Tests unitarios y de integración
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-${{ matrix.python-version }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov httpx

    - name: Create log directory
      run: mkdir -p var/logs

    - name: Run tests - Quick (no lentos)
      run: |
        python -m pytest tests/ -v --tb=short -m "not lento" --cov=app --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  # Job 3: Tests completos (incluyendo lentos)
  test-full:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov httpx

    - name: Create log directory
      run: mkdir -p var/logs

    - name: Run all tests (including slow ones)
      run: |
        python -m pytest tests/ -v --tb=short --cov=app --cov-report=html --cov-report=term

    - name: Archive coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

  # Job 4: Validación de seguridad
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run safety check (dependencies)
      run: |
        if [ -f requirements.txt ]; then safety check --file requirements.txt --output text || true; fi
      continue-on-error: true

    - name: Run bandit (code security)
      run: |
        bandit -r app/ -f txt -o bandit-report.txt || true
        cat bandit-report.txt || echo "No issues found"
      continue-on-error: true

  # Job 5: Build y validación de Docker (opcional)
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check if Dockerfile exists
      id: check_dockerfile
      run: |
        if [ -f Dockerfile ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      if: steps.check_dockerfile.outputs.exists == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      if: steps.check_dockerfile.outputs.exists == 'true'
      run: |
        docker build -t scriptum-api:test .

    - name: Test Docker image
      if: steps.check_dockerfile.outputs.exists == 'true'
      run: |
        docker run -d --name test-api -p 8000:8000 scriptum-api:test
        sleep 5
        curl -f http://localhost:8000/health || exit 1
        docker stop test-api

  # Job 6: Summary y notificación
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, test-full, security]
    if: always()

    steps:
    - name: Check job statuses
      run: |
        echo "### CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Full Tests | ${{ needs.test-full.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Final status
      run: |
        if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.test-full.result }}" != "success" ]; then
          echo "❌ **Tests failed!** Please review the test results." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
        fi
