# Pipeline rápido para desarrollo
# Se ejecuta solo en push a ramas de desarrollo
# Ejecuta únicamente tests rápidos para feedback inmediato

name: Quick Tests

on:
  push:
    branches-ignore: [ main ]

jobs:
  quick-test:
    name: Quick Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx

    - name: Create log directory
      run: mkdir -p var/logs

    - name: Run quick tests only
      run: |
        python -m pytest tests/ -v --tb=short -m "not lento" -x

    - name: Summary
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Quick tests passed!"
        else
          echo "❌ Quick tests failed!"
        fi
