[pytest]
# Configuración de pytest para Scriptum API

# Patrón de búsqueda de archivos de test
python_files = test_*.py

# Patrón de búsqueda de clases de test
python_classes = Test*

# Patrón de búsqueda de funciones de test
python_functions = test_*

# Directorio donde buscar tests
testpaths = tests

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Marcadores personalizados
markers =
    rapido: Tests rápidos que se ejecutan en CI/CD
    lento: Tests que tardan más tiempo (archivos grandes, etc.)
    seguridad: Tests relacionados con validaciones de seguridad
    integracion: Tests de integración de la API
    unitario: Tests unitarios de servicios
    empaquetado: Tests de empaquetado de archivos cifrados
    streaming: Tests de procesamiento de archivos grandes

# Configuración de cobertura (si usas pytest-cov)
# Descomentar si instalas pytest-cov
# [coverage:run]
# source = app
# omit =
#     */tests/*
#     */venv/*
#     */__pycache__/*

# [coverage:report]
# precision = 2
# skip_empty = True
# show_missing = True
